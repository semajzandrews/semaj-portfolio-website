  the PTS / US_NATION / US_BORDERS constants below so this file has no
  network or package dependencies. Every city listed has a real Apple Store.

  Composition rule: a dominant typographic layer (statement + figures) carries
  the card-size view at ~411px wide; the map is supporting texture. Nothing
  below ~16px in this 1600px source is load-bearing.

  :root{
    --bg:#060709;

  *{margin:0;padding:0;box-sizing:border-box}

  .topbar{position:absolute;top:52px;left:76px;right:76px;display:flex;justify-content:space-between;
    align-items:center;font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .topbar .l{display:flex;align-items:center;gap:12px}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--live);
    box-shadow:0 0 0 4px rgba(61,220,151,.13),0 0 12px rgba(61,220,151,.85)}
  .sep{color:var(--dimmer);margin:0 9px}

  .lede{position:absolute;left:76px;top:172px;width:700px}
  .eyebrow{font-size:13px;letter-spacing:.26em;color:var(--live);text-transform:uppercase;margin-bottom:20px}
  h1{font-size:80px;line-height:.94;letter-spacing:-.045em;font-weight:700}
  h1 .thin{color:#7a838f;font-weight:300}
  .sub{margin-top:32px;font-size:62px;line-height:1.12;letter-spacing:-.028em;
    font-weight:600;color:#d3dce5;max-width:660px}

  .stats{position:absolute;left:76px;right:76px;top:686px;
    border-top:1px solid rgba(255,255,255,.10);padding-top:34px;display:flex;gap:104px}
  .stat .n{font-size:74px;font-weight:600;letter-spacing:-.035em;line-height:1}
  .stat .n .u{color:#7a838f;font-size:44px;font-weight:400}
  .stat .k{margin-top:14px;font-size:17px;letter-spacing:.02em;color:#8b96a2;line-height:1.35}

  #map{position:absolute;left:664px;top:150px;width:900px;height:476px;opacity:.95}
  #map svg{width:100%;height:100%;overflow:visible}

  .callout{position:absolute;font-size:17px;letter-spacing:.02em;color:#d6dee6}
  .callout .t{color:var(--flare);letter-spacing:.2em;font-size:13px;text-transform:uppercase;margin-bottom:8px}
</style>
