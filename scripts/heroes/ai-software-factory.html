<meta charset="utf-8">
<title>AI Software Factory hero</title>
<!--
  Source for public/projects/ai-software-factory/hero.png (1600x900).
  Regenerate:  node scripts/heroes/render.mjs ai-software-factory

  Depicts the Factory's 4-phase gated pipeline as an ordered march: a progress
  spine running 01 -> 02 -> 03 -> 04, completed stages behind, the current
  stage working, gate 03 holding as a wall, and phase 04 empty ahead.
  All geometry is computed in-file. No network or package dependency.

  Composition rule: a dominant typographic layer (statement + figures) carries
  the card-size view at ~411px wide; the pipeline is supporting texture.
  Nothing below ~16px in this 1600px source is load-bearing.

  Phase names, agent count, platform targets and the gate rule come from
  app/data/projects.ts. ILLUSTRATIVE (not captured from a real run): which
  gate is holding, the per-stage task counts, and the chip blocks pressed
  against the gate. They show the system's shape, not a recorded build.
-->
<style>
  :root{
    --bg:#060709;
    --line:rgba(255,255,255,.055);
    --ink:#f0f3f6;
    --dim:#818c99;
    --dimmer:#4a525d;
    --flow:#5b8cff;
    --hold:#ffb020;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:900px;background:var(--bg);overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Monaco,"Courier New",monospace}
  #stage{position:relative;width:1600px;height:900px;overflow:hidden}

  #grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(115% 95% at 64% 42%,#000 20%,transparent 75%)}
  #glow{position:absolute;left:62%;top:40%;width:1200px;height:980px;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(91,140,255,.09),rgba(91,140,255,0) 70%)}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(125% 105% at 58% 40%,transparent 42%,rgba(0,0,0,.9))}

  .topbar{position:absolute;top:52px;left:76px;right:76px;display:flex;justify-content:space-between;
    align-items:center;font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .topbar .l{display:flex;align-items:center;gap:12px}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--flow);
    box-shadow:0 0 0 4px rgba(91,140,255,.13),0 0 12px rgba(91,140,255,.85)}
  .sep{color:var(--dimmer);margin:0 9px}

  .lede{position:absolute;left:76px;top:172px;width:660px}
  .eyebrow{font-size:13px;letter-spacing:.26em;color:var(--flow);text-transform:uppercase;margin-bottom:20px}
  h1{font-size:74px;line-height:.96;letter-spacing:-.045em;font-weight:700}
  h1 .thin{color:#7a838f;font-weight:300}
  .sub{margin-top:32px;font-size:62px;line-height:1.12;letter-spacing:-.028em;
    font-weight:600;color:#d3dce5;max-width:660px}

  .stats{position:absolute;left:76px;right:76px;top:686px;
    border-top:1px solid rgba(255,255,255,.10);padding-top:34px;display:flex;gap:104px}
  .stat .n{font-size:74px;font-weight:600;letter-spacing:-.035em;line-height:1}
  .stat .k{margin-top:14px;font-size:17px;letter-spacing:.02em;color:#8b96a2;line-height:1.35}

  #pipe{position:absolute;left:664px;top:186px;width:900px;height:400px}
  #pipe svg{width:100%;height:100%;overflow:visible}
</style>

<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>

  <div class="topbar mono">
    <div class="l"><span class="pulse"></span><span>Deterministic build pipeline</span><span class="sep">/</span><span>phase 03 of 04</span><span class="sep">/</span><span>holding</span></div>
    <div>Web<span class="sep">·</span>iOS<span class="sep">·</span>Android<span class="sep">·</span>PWA<span class="sep">·</span>Chrome Extension</div>
  </div>

  <div class="lede">
    <div class="eyebrow mono">Multi-agent specialist swarm</div>
    <h1>AI Software<br><span class="thin">Factory</span></h1>
    <div class="sub">Nothing advances<br>until its gate passes.</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="n">4</div>
      <div class="k">Gated phases, in order</div>
    </div>
    <div class="stat">
      <div class="n">6</div>
      <div class="k">Specialist agents</div>
    </div>
    <div class="stat">
      <div class="n">5</div>
      <div class="k">Platform targets, one spec</div>
    </div>
  </div>

  <div id="pipe"><svg id="svg" viewBox="0 0 900 400"></svg></div>

  <div id="vig"></div>
</div>

<script>
const W=900,H=400;
const svg=document.getElementById('svg');
const ns="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function add(e){svg.appendChild(e);return e;}
const MONO='ui-monospace,Menlo,monospace';
const SANS='-apple-system,Helvetica,Arial,sans-serif';
function txt(x,y,s,o){const t=add(el('text',Object.assign({x:x,y:y,'font-family':MONO},o)));t.textContent=s;return t;}

const defs=el('defs');
defs.innerHTML=`
<radialGradient id="hg"><stop offset="0" stop-color="#ffb020" stop-opacity=".24"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
<linearGradient id="gateg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffb020" stop-opacity=".15"/><stop offset=".5" stop-color="#ffb020" stop-opacity="1"/>
  <stop offset="1" stop-color="#ffb020" stop-opacity=".15"/></linearGradient>
<linearGradient id="cur" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5b8cff" stop-opacity=".11"/><stop offset="1" stop-color="#5b8cff" stop-opacity=".02"/></linearGradient>`;
add(defs);

/* ---- stage geometry: an ordered left-to-right march --------------------- */
const CW=198, G=[22,22,42];
const X=[0]; X.push(X[0]+CW+G[0]); X.push(X[1]+CW+G[1]); X.push(X[2]+CW+G[2]);
const CY=74, CH=252, CB=CY+CH;
const gapC=i=>X[i]+CW+G[i]/2;
const GX=gapC(2);                           // the held gate

/* state: 2 = done and handed off, 1 = working now, 0 = not started */
const STAGES=[
  {n:'01',name:'Brain',       st:2, work:18},
  {n:'02',name:'Design',      st:2, work:14},
  {n:'03',name:'Atomization', st:1, work:16},
  {n:'04',name:'Execution',   st:0, work:0}
];

/* ---- progress spine ----------------------------------------------------- */
const SY=22;
add(el('line',{x1:0,y1:SY,x2:W,y2:SY,stroke:'#252c34','stroke-width':2}));
add(el('line',{x1:0,y1:SY,x2:GX,y2:SY,stroke:'#5b8cff','stroke-width':2,'stroke-opacity':.6}));
for(let x=54;x<GX-24;x+=78)
  add(el('path',{d:`M${x-4} ${SY-4} L${x+4} ${SY} L${x-4} ${SY+4}`,fill:'none',
    stroke:'#8fb0ff','stroke-width':1.5,'stroke-opacity':.55}));
add(el('line',{x1:GX,y1:SY,x2:W,y2:SY,stroke:'#2f3740','stroke-width':2,'stroke-dasharray':'4 8'}));

/* ---- stage cards: name + the work, nothing smaller ---------------------- */
STAGES.forEach((s,i)=>{
  const x=X[i], now=s.st===1, off=s.st===0;
  add(el('rect',{x:x,y:CY,width:CW,height:CH,rx:6,
    fill:now?'url(#cur)':(off?'rgba(255,255,255,.008)':'rgba(91,140,255,.022)'),
    stroke:now?'rgba(91,140,255,.42)':(off?'rgba(255,255,255,.075)':'rgba(255,255,255,.055)'),
    'stroke-width':1,'stroke-dasharray':off?'4 5':'none'}));

  const px=x+20, nx=x+CW/2;
  add(el('circle',{cx:nx,cy:SY,r:14,fill:'#060709',
    stroke:off?'#333b45':(now?'#ffb020':'#5b8cff'),'stroke-width':1.4,'stroke-opacity':.9}));
  const nn=add(el('text',{x:nx,y:SY+4,'text-anchor':'middle','font-family':MONO,'font-size':11,
    'letter-spacing':.6,fill:off?'#5c6672':(now?'#ffc655':'#9dbaff')}));
  nn.textContent=s.n;
  add(el('line',{x1:nx,y1:SY+14,x2:nx,y2:CY,stroke:off?'#252c34':'rgba(91,140,255,.22)','stroke-width':1}));

  const t=add(el('text',{x:px,y:CY+50,fill:off?'#5f6874':'#e6ebf0','font-size':30,
    'font-family':SANS,'font-weight':600,'letter-spacing':-.8}));
  t.textContent=s.name;

  // the work itself, as texture
  const wy=CY+96, CWD=24,CHT=8,GAPX=8,GAPY=10,PER=5;
  for(let k=0;k<(off?10:s.work);k++){
    const cx=px+(k%PER)*(CWD+GAPX), cy=wy+Math.floor(k/PER)*(CHT+GAPY);
    if(off) add(el('rect',{x:cx,y:cy,width:CWD,height:CHT,rx:4,fill:'none',
      stroke:'#2b323b','stroke-width':1}));
    else if(now) add(el('rect',{x:cx,y:cy,width:CWD,height:CHT,rx:4,fill:'#5b8cff','fill-opacity':.26,
      stroke:'#5b8cff','stroke-width':1,'stroke-opacity':.6}));
    else add(el('rect',{x:cx,y:cy,width:CWD,height:CHT,rx:4,fill:'#5b8cff','fill-opacity':.11}));
  }
});

/* ---- handoffs between stages ------------------------------------------- */
[0,1].forEach(i=>{
  const cx=gapC(i), my=CY+CH/2;
  add(el('line',{x1:X[i]+CW,y1:my,x2:X[i+1],y2:my,stroke:'#5b8cff','stroke-width':1.4,'stroke-opacity':.35}));
  add(el('path',{d:`M${cx-5} ${my-9} L${cx+6} ${my} L${cx-5} ${my+9}`,fill:'none',
    stroke:'#8fb0ff','stroke-width':2.2,'stroke-opacity':.8,'stroke-linecap':'round','stroke-linejoin':'round'}));
});

/* ---- gate 03: the wall the march has stacked against -------------------- */
add(el('rect',{x:GX-30,y:CY-14,width:60,height:CH+28,fill:'url(#hg)'}));
add(el('rect',{x:GX-2.5,y:SY-11,width:5,height:22,rx:2,fill:'#ffb020'}));
add(el('rect',{x:GX-2,y:CY-8,width:4,height:CH+16,rx:2,fill:'url(#gateg)'}));
const hl=add(el('text',{x:GX,y:CB+40,'text-anchor':'middle','font-family':MONO,'font-size':17,
  'letter-spacing':2.2,fill:'#ffb020'}));
hl.textContent='GATE 03 HELD';
// work pressed up against it, on the near side only
const QR=X[2]+CW-12;
[26,20,26,17,26].forEach((w,k)=>
  add(el('rect',{x:QR-w,y:CY+152+k*17,width:w,height:9,rx:3,fill:'#ffb020','fill-opacity':.9})));

document.body.setAttribute('data-ready','1');
</script>
